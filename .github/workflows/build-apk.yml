name: Compiler l'APK Android

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: SDK Android (préinstallé sur le runner)
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties && yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Dépendances
        run: npm ci

      - name: Numéro de version dans l'appli
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          echo "{\"build\": $BUILD_NUMBER}" > www/version.json

      - name: Synchroniser l'appli web dans le projet Android
        run: npx cap sync android

      - name: Compiler
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk Ascension.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ascension 1.0.${{ github.run_number }}
          body: Télécharger Ascension.apk sur le téléphone, puis l'ouvrir pour installer ou mettre à jour.
          files: Ascension.apk
          make_latest: true
