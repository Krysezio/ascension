<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Ascension — 90 jours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080808;--card:#121110;--card2:#1a1815;--line:#2b261c;--txt:#f4efe2;--mut:#948b78;--acc:#c9a227;--acc2:#ecd082;--ok:#35c98a;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 Inter,system-ui,sans-serif}
body{--sat:var(--safe-area-inset-top,env(safe-area-inset-top));--sab:var(--safe-area-inset-bottom,env(safe-area-inset-bottom));padding:var(--sat) var(--safe-area-inset-right,env(safe-area-inset-right)) calc(84px + var(--sab)) var(--safe-area-inset-left,env(safe-area-inset-left))}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px}
h1,h2,.disp{font-family:"Archivo Black",Inter,sans-serif;letter-spacing:.01em;margin:0}
.mut{color:var(--mut)} .sm{font-size:12.5px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.day{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc2);font-weight:700}
.big{font-size:40px;line-height:1}
.big span{background:linear-gradient(90deg,#b8902a,#f1d27a 60%,#c9a227);-webkit-background-clip:text;background-clip:text;color:transparent}
.ring{width:74px;height:74px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:16px}
.card{background:linear-gradient(180deg,#14120f,#0e0d0b);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chip{flex:1;background:linear-gradient(180deg,#16140f,#0f0e0c);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.chip .disp{font-size:18px}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .4s}
.goal-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.goal-h .disp{font-size:16px}
.act{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer;user-select:none}
.act:first-of-type{border-top:0}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid #3a3a41;flex:none;display:grid;place-items:center;transition:.15s}
.act.done .ck{background:var(--acc);border-color:var(--acc)}
.act.done .ck:after{content:"";width:7px;height:12px;border:solid #120f08;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.act.done .lbl{color:var(--mut);text-decoration:line-through}
.det{font-size:12.5px;color:var(--mut);margin-top:2px;text-decoration:none}
.lbl{flex:1}
.xp{font-size:12px;color:var(--acc2);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(11,11,12,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--sab)}
nav button{flex:1;max-width:173px;background:none;border:0;color:var(--mut);padding:12px 0 14px;font:600 12px Inter;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--txt)} nav button.on .ic{color:var(--acc)}
.ic{font-size:20px;line-height:1}
input,select{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 10px;font:inherit;width:100%}
input:focus,select:focus{outline:none;border-color:var(--acc)}
.btn{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:600 13px Inter;cursor:pointer;white-space:normal;line-height:1.25}
.btn.p{background:linear-gradient(135deg,#e2c062,#b8902a);border-color:#c9a227;color:#120f08}
.btn.d{color:#ff8a8a}
.btn.armed{background:#4a3c12;border-color:var(--acc);color:#fff}
.edit-a{display:grid;grid-template-columns:1fr 72px auto;gap:8px;margin-top:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.grid66{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.cell{aspect-ratio:1;border-radius:5px;background:var(--card2);display:grid;place-items:center;font-size:9px;color:#55555c}
.cell.l1{background:#3a3016}.cell.l2{background:#7a6322}.cell.l3{background:var(--acc);color:#111}
.cell.today{outline:2px solid var(--acc2);outline-offset:1px}
.cell.fut{opacity:.45}
.skill{margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%) translateY(20px);background:var(--txt);color:#000;font-weight:700;padding:11px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.sync{font-size:11px;color:var(--mut);text-align:center;margin-top:18px}
.empty{text-align:center;padding:30px 10px}
label.f{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.loading{display:grid;place-items:center;height:70vh;color:var(--mut)}
.ob{min-height:80vh;display:flex;flex-direction:column}
#launch{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s ease}
#launch .lg{width:132px;height:132px;opacity:0;animation:lgin 1.1s .15s cubic-bezier(.2,.7,.2,1) forwards}

@keyframes lgin{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes lgw{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.intro{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 7vh) 22px calc(env(safe-area-inset-bottom,0px) + 22px);overflow:hidden}
.intro .ilogo{width:120px;height:120px;flex:none;animation:ilogo 3.4s cubic-bezier(.6,0,.2,1) both}
.intro .ilogo svg{width:100%;height:100%;filter:drop-shadow(0 0 26px rgba(201,162,39,.45))}
@keyframes ilogo{0%{opacity:0;transform:translateY(calc(43vh - 60px - 7vh)) scale(.75)}24%{opacity:1;transform:translateY(calc(43vh - 60px - 7vh)) scale(1.3)}76%{opacity:1;transform:translateY(calc(43vh - 60px - 7vh)) scale(1.3)}100%{opacity:1;transform:translateY(0) scale(1)}}
.intro .iw{font-size:13px;letter-spacing:.3em;color:var(--acc2);font-weight:700;margin-top:18px;animation:ifade .8s 3.4s both}
.intro h1{font-size:34px;line-height:1.1;margin-top:10px;animation:ifade .8s 3.7s both}
.intro h1 span{background:linear-gradient(90deg,#f6dc8c,#c9a227);-webkit-background-clip:text;background-clip:text;color:transparent}
.intro p{color:var(--mut);margin-top:16px;max-width:320px;font-size:16px;line-height:1.5;animation:ifade .8s 4.2s both}
.intro .ib{margin-top:auto;width:100%;max-width:440px;animation:ifade .8s 4.8s both}
.intro .ib .btn{width:100%;padding:15px;font-size:16px}
@keyframes ifade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ob .prog{height:4px;background:var(--card2);border-radius:9px;margin:4px 0 26px;overflow:hidden}
.ob .prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.ob h2{font-size:26px;line-height:1.15;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);color:var(--txt);border-radius:14px;padding:15px 16px;font:600 15px Inter;margin-bottom:10px;cursor:pointer}

.banner{cursor:pointer;border-color:var(--acc2)}

.vcard{position:relative;flex:0 0 78%;height:150px;border-radius:16px;overflow:hidden;border:1px solid #3a321f;background:radial-gradient(120% 90% at 85% 30%,#211b0f,#0b0a08);scroll-snap-align:start;cursor:pointer}

.vk{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc2);font-weight:700}
.vt{font-family:"Archivo Black",Inter,sans-serif;font-size:17px;line-height:1.15;margin-top:4px;color:var(--txt)}
.gvis{position:relative;height:120px;border-radius:12px;overflow:hidden;margin-top:10px;border:1px solid #3a321f;background:radial-gradient(120% 90% at 50% 30%,#211b0f,#0b0a08)}
.gvis .vart{right:50%;transform:translateX(50%);top:4px;height:112px;width:112px}
.gvis .vov{background:linear-gradient(0deg,rgba(8,8,8,.5),rgba(8,8,8,0))}
.upd{display:flex;align-items:center;justify-content:space-between;gap:10px;border-color:var(--acc)}
#modal{position:fixed;inset:0;background:rgba(5,5,5,.86);backdrop-filter:blur(6px);z-index:8;display:none;overflow-y:auto;padding:calc(var(--sat) + 18px) 14px calc(var(--sab) + 18px)}
#modal.on{display:block}
.mbox{max-width:520px;margin:0 auto}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.rv:first-of-type{border-top:0}
.sg{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.tro{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tr{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:8px 4px;border-radius:12px;background:#0e0d0b;border:1px solid var(--line);opacity:.35;filter:grayscale(1)}
.tr.on{opacity:1;filter:none;border-color:#5c4a1e}
.tr b{font-size:12px}.tr span{font-size:10.5px;color:var(--mut);line-height:1.2}
.medal{width:54px;height:54px}
.tbtn{margin-top:4px;background:#1a1610;border:1px solid #5c4a1e;color:var(--acc2);border-radius:8px;font:700 11px Inter;padding:4px 7px;cursor:pointer}
.tm{text-align:center;padding-top:30px}
.tring{position:relative;width:220px;height:220px;margin:0 auto}
.tring b{position:absolute;inset:0;display:grid;place-items:center;font:400 44px "Archivo Black",Inter,sans-serif;color:var(--acc2)}
.jr summary,.jh summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none;gap:10px}

.jh{padding:8px 0;border-top:1px solid var(--line)}.jh:first-of-type{border-top:0}
.rit{padding-top:6px}.ritlogo svg{display:block;width:72px;height:72px;margin:0 auto 4px}

.fin{border-color:var(--acc)}
.wdb{display:flex;gap:6px;align-items:flex-end}

.wdbar i{display:block;width:100%;background:linear-gradient(0deg,#a87f1f,#f1d27a);border-radius:6px}
nav button{max-width:130px}
.tlr{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}.tlr:first-of-type{border-top:0}

.wdsel button.on,.segs button.on{border-color:var(--acc);color:var(--txt);background:#251f0e}
.tl{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.tl:first-of-type{border-top:0}
.tl input{width:92px;flex:none;padding:7px}
.evr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.evr:first-child{border-top:0}
.chk{display:flex;gap:12px;flex-wrap:wrap}.chk label{display:flex;gap:5px;align-items:center;font-size:13px}.chk input{width:auto;accent-color:#c9a227}
nav button{max-width:110px;font-size:11px}
.calr{opacity:.75}.calr .lbl{padding:10px 4px;color:#cfc6b0}
.calr.rdv{opacity:1}.calr.rdv .lbl{color:var(--acc2)}
.agnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.agnav>div{text-align:center;text-transform:capitalize;flex:1;min-width:0}.agnav .tbtn{display:block;margin:4px auto 0}
.grid{position:relative;margin:6px 0 10px 44px;border-left:1px solid var(--line)}
.gh{position:absolute;left:-44px;right:0;border-top:1px solid #1e1b15;height:0}.gh span{position:absolute;left:0;top:-7px;font-size:10.5px;color:var(--mut);width:38px;text-align:right}

/* ---------- rappels programmés (notifications locales Android) ---------- */
const NOTIF_DAYS=14;
const wakeToTime=w=>{const m=/^(\d{1,2}) h(?: (\d{2}))?$/.exec(w||"");return m?z(+m[1])+":"+(m[2]||"00"):null};
const atTime=(k,hm)=>{const[h,m]=(hm||"00:00").split(":").map(Number);const d=parse(k);d.setHours(h||0,m||0,0,0);return d};
function scheduleSoon(){clearTimeout(scheduleSoon.t);scheduleSoon.t=setTimeout(scheduleAll,1200)}
function buildNotifs(){
  const out=[],now=Date.now()+30000;
  if(!S||!S.onboarded||!S.notif||!S.notif.on)return out;
  const T=S.notif.times,metrics=S.goals.filter(g=>g.metric&&g.metric.n);
  for(let i=0;i<NOTIF_DAYS;i++){
    const k=addDays(today(),i);if(k<S.startDate)continue;if(diff(S.startDate,k)>=S.length)break;
    const L=S.log[k]||{},D=due(k).filter(a=>!L[a.id]);let n=0;
    const push=(at,title,body,ids)=>{if(at.getTime()>now){const o={id:(i+1)*100+(n++),title,body,largeBody:body,schedule:{at,allowWhileIdle:true},channelId:"rappels",smallIcon:"ic_stat_ascension",iconColor:"#C9A227",extra:{day:k,ids:ids||[]}};if(ids&&ids.length)o.actionTypeId="PROMESSES";out.push(o)}};
    const line=a=>{const d=detailOf(a,k);return"• "+(a.core?"⭐ ":"")+(a.trig?a.trig+" → ":"")+a.label+(d?" — "+d:"")};
    ["matin","midi","aprem","soir"].forEach(s=>{const list=D.filter(a=>(a.slot||"")===s&&!timeOf(a,k)).sort((a,b)=>b.core-a.core);
      if(list.length)push(atTime(k,slotT(k,s)),`${SLOTS[s]} · ${list.length} promesse${list.length>1?"s":""}`,list.map(line).join("\n"),list.map(a=>a.id))});
    D.filter(a=>timeOf(a,k)).forEach(a=>push(atTime(k,timeOf(a,k)),"⏰ "+a.label,detailOf(a,k)||"C'est l'heure.",[a.id]));
    if(mod("dates"))evTasks(k).filter(e=>!L[e.key]).forEach(e=>push(atTime(k,e.time),e.e+" "+e.label,"Date importante · Ascension"));
    (S.appts||[]).filter(r=>r.date===k&&r.time&&!r.gid).forEach(r=>push(new Date(atTime(k,r.time).getTime()-15*60000),"📅 Dans 15 min : "+r.t,(r.loc?r.loc+" · ":"")+r.time+" · Ascension"));
    (S.todos||[]).filter(t=>!t.done&&t.date===k&&t.time).forEach(t=>push(atTime(k,t.time),"✅ "+t.t,"À faire · Ascension"));
    {const prevL=S.log[addDays(k,-1)]||{},prevDue=addDays(k,-1)>=S.startDate?due(addDays(k,-1)).filter(a=>a.core&&!prevL[a.id]&&dueOn(a,k)&&!L[a.id]):[];
     if(prevDue.length&&!S.jokers[addDays(k,-1)])push(atTime(k,"12:30"),"⚠️ Ne rate pas deux fois",prevDue.map(a=>"• "+a.label).join("\n")+"\nRaté hier : aujourd'hui, c'est non négociable.",prevDue.map(a=>a.id))}
    {const rc=due(k).filter(a=>a.core&&!L[a.id]);if(rc.length&&S.notif.relance&&!S.jokers[k])push(atTime(k,S.notif.relance),`⚠️ Il te reste ${rc.length} socle${rc.length>1?"s":""}`,rc.map(a=>"• "+a.label).join("\n")+"\nTiens ta série 🔥",rc.map(a=>a.id))}
    if(!(i===0&&valid(k))&&due(k).length){const core=due(k).filter(a=>a.core);
      push(atTime(k,S.notif.bilan),"🌙 Bilan du jour",core.length?"Ton socle : "+core.map(a=>a.label).join(", ")+". Coche ce que tu as tenu, puis 3 lignes au journal.":"Coche ce que tu as tenu, puis 3 lignes au journal.")}
    if(k.slice(8)==="01"&&(S.wealth.items||[]).length)push(atTime(k,"10:00"),"💰 Relevé de patrimoine du mois","Mets à jour tes montants dans Vision → Patrimoine (2 minutes).");
    if(parse(k).getDay()===0&&metrics.length)push(atTime(k,S.notif.mesure),"📏 Mesure de la semaine",metrics.map(g=>g.metric.n).join(" · "));
    if(i===NOTIF_DAYS-1)push(atTime(k,"20:00"),"Ascension","Ouvre l'appli pour recharger tes rappels des deux prochaines semaines.");
  }
  return out;
}
async function scheduleAll(){
  if(!LN||!S||!S.onboarded)return;
  try{
    const p=await LN.checkPermissions();notifPerm=p.display;
    if(p.display==="prompt"||p.display==="prompt-with-rationale"){const r=await LN.requestPermissions();notifPerm=r.display}
    try{const e=await LN.checkExactNotificationSetting();exactPerm=e.exact_alarm}catch(e){}
    try{await LN.createChannel({id:"rappels",name:"Rappels",description:"Rappels des promesses du jour",importance:4,visibility:1,vibration:true})}catch(e){}
    const pend=await LN.getPending();
    const old=(pend.notifications||[]).filter(x=>x.id<8000).map(x=>({id:x.id}));
    if(old.length)await LN.cancel({notifications:old});
    notifCount=0;
    if(notifPerm==="granted"){const list=buildNotifs();if(list.length)await LN.schedule({notifications:list});notifCount=list.length}
  }catch(e){console.log("rappels",e)}
  const c=document.getElementById("ncount");if(c)c.textContent=notifCount;
  if(tab==="stats"&&!ob&&document.getElementById("nstate"))document.getElementById("nstate").innerHTML=notifStateHtml();
}
function notifStateHtml(){
  if(!LN)return`<div class="mut sm">Les rappels fonctionnent dans l'appli Android installée.</div>`;
  let h=`<div class="mut sm"><span id="ncount">${notifCount}</span> rappels programmés sur 14 jours.</div>`;
  if(notifPerm==="denied")h+=`<div class="warn">Notifications refusées. Active-les : Paramètres Android → Applications → Ascension → Notifications.</div>`;
  if(exactPerm==="denied"||exactPerm==="prompt")h+=`<button class="btn" style="margin-top:8px;width:100%" data-do="exact">Autoriser les rappels à l'heure exacte</button>`;
  return h;
}


/* ---------- mise à jour automatique (dernière version publiée sur GitHub) ---------- */
const REPO="Krysezio/ascension";
const Updater=NATIVE&&capacitorExports.registerPlugin?capacitorExports.registerPlugin("AppUpdater"):null;
let myBuild=0,upd=null,updBusy=false,lastCheck=0;
async function checkUpdate(force){
  if(!Updater)return;if(!force&&Date.now()-lastCheck<6*3600e3)return;lastCheck=Date.now();
  try{
    if(!myBuild){const v=await fetch("version.json",{cache:"no-store"}).then(r=>r.json());myBuild=+v.build||0}
    const r=await fetch(`https://api.github.com/repos/${REPO}/releases/latest`,{headers:{Accept:"application/vnd.github+json"}});if(!r.ok)return;
    const j=await r.json(),b=+String(j.tag_name||"").split(".").pop()||0,a=(j.assets||[]).find(x=>/\.apk$/i.test(x.name));
    if(a&&b>myBuild){upd={build:b,url:a.browser_download_url,tag:j.tag_name};
      if(S&&S.notifiedBuild!==b&&LN){S.notifiedBuild=b;persist();
        LN.schedule({notifications:[{id:9001,title:"Ascension : nouvelle version "+j.tag_name.replace(/^v/,""),body:"Ouvre l'appli et appuie sur « Mettre à jour ».",schedule:{at:new Date(Date.now()+1500),allowWhileIdle:true},channelId:"rappels",smallIcon:"ic_stat_ascension",iconColor:"#C9A227"}]}).catch(()=>{})}
      if(!ob)render()}
    else upd=null;
  }catch(e){}
}
async function doUpdate(){
  if(!Updater||!upd||updBusy)return;
  try{const c=await Updater.canInstall();if(!c.allowed){toast("Autorise Ascension à installer des applis, puis reviens et appuie à nouveau");await Updater.openInstallSettings();return}}catch(e){}
  updBusy=true;render();toast("Téléchargement de la mise à jour…");
  try{await Updater.downloadAndInstall({url:upd.url})}catch(e){toast(String(e&&e.message||e))}
  updBusy=false;render();
}
function updBanner(){return upd?`<div class="card upd"><div><b>⬆️ Nouvelle version ${esc(upd.tag.replace(/^v/,""))}</b><div class="mut sm">Tes données sont conservées.</div></div><button class="btn p" data-do="update" ${updBusy?"disabled":""}>${updBusy?"Téléchargement…":"Mettre à jour"}</button></div>`:""}

/* ---------- actions dans les notifications ---------- */
function markDone(ids,k){
  const L=S.log[k]||(S.log[k]={});let n=0;
  (ids||[]).forEach(id=>{const a=S.actions.find(x=>x.id===id);if(a&&!L[id]){L[id]={x:a.xp,g:a.goalId};n++}});
  if(!Object.keys(L).length)delete S.log[k];
  persist();checkTrophies();render();return n;
}
let notifListening=false;
async function setupNotifActions(){
  if(!LN||notifListening)return;notifListening=true;
  try{await LN.registerActionTypes({types:[{id:"PROMESSES",actions:[{id:"done",title:"✓ Fait"},{id:"snooze",title:"⏰ Dans 1 h"}]}]})}catch(e){}
  try{LN.addListener("localNotificationActionPerformed",ev=>{
    const n=ev.notification||{},ex=n.extra||{};
    if(ev.actionId==="done"&&ex.ids&&ex.ids.length){const c=markDone(ex.ids,ex.day||today());toast(c?`✓ ${c} promesse${c>1?"s":""} cochée${c>1?"s":""}`:"Déjà cochée")}
    else if(ev.actionId==="snooze"){LN.schedule({notifications:[{id:8000+Math.floor(Math.random()*900),title:n.title,body:n.body,largeBody:n.body,actionTypeId:"PROMESSES",extra:ex,
      schedule:{at:new Date(Date.now()+3600e3),allowWhileIdle:true},channelId:"rappels",smallIcon:"ic_stat_ascension",iconColor:"#C9A227"}]}).then(()=>toast("Rappel dans 1 h")).catch(()=>{})}
  })}catch(e){}
}

function heldDays(){let n=0;for(let d=S.startDate;d<=today()&&diff(S.startDate,d)<S.length;d=addDays(d,1))if(valid(d))n++;return n}
const elapsedDays=()=>Math.max(0,diff(S.startDate,today())+1);
const TROPHIES=[
 {id:"first",n:"Premier jour",d:"Premier socle tenu",m:"1",t:()=>heldDays()>=1},
 {id:"s7",n:"Semaine de fer",d:"7 jours d'affilée",m:"7",t:()=>streak()>=7},
 {id:"s30",n:"Mois d'acier",d:"30 jours d'affilée",m:"30",t:()=>streak()>=30},
 {id:"s60",n:"Inarrêtable",d:"60 jours d'affilée",m:"60",t:()=>streak()>=60},
 {id:"p1",n:"Fondation",d:"Phase 1 terminée",m:"I",t:()=>elapsedDays()>Math.ceil(S.length/3)},
 {id:"p2",n:"Construction",d:"Phase 2 terminée",m:"II",t:()=>elapsedDays()>Math.ceil(2*S.length/3)},
 {id:"m1",n:"Mesuré",d:"Première mesure enregistrée",m:"M",t:()=>Object.values(S.measures).some(m=>m.length)},
 {id:"x1000",n:"Mille",d:"1 000 XP",m:"1K",t:()=>totalXP()>=1000},
 {id:"j7",n:"Plume",d:"7 soirs de journal",m:"J",t:()=>Object.keys(S.journal||{}).length>=7},
 {id:"legend",n:"Légende",d:"90 jours terminés, 70 % tenus",blason:true,t:()=>elapsedDays()>=S.length&&heldDays()>=.7*S.length}

function checkTrophies(){
  if(!S||!S.onboarded)return;S.trophies=S.trophies||{};const got=[];

/* ---------- bilan de la semaine ---------- */
function weekReview(endDay){
  const days=[];for(let i=6;i>=0;i--){const d=addDays(endDay,-i);if(d>=S.startDate&&diff(S.startDate,d)<S.length)days.push(d)}
  const held=days.filter(valid).length;
  const rows=S.actions.map(a=>{let du=0,dn=0;days.forEach(d=>{if(dueOn(a,d)){du++;if((S.log[d]||{})[a.id])dn++}});return{a,du,dn,r:du?dn/du:null}}).filter(x=>x.du>0);
  const sorted=rows.slice().sort((x,y)=>y.r-x.r);
  const best=sorted.filter(x=>x.r>=.5).slice(0,3),worst=sorted.slice().reverse().filter(x=>x.r<.6).slice(0,3);
  const sugg=[];
  rows.filter(x=>x.du>=3&&x.r<.5).forEach(x=>{
    if(x.a.freq==="d")sugg.push({a:x.a,txt:`« ${x.a.label} » tenu ${x.dn}/${x.du} : passer à 3 fois par semaine (lun · mer · ven) ?`,kind:"f135",btn:"Passer à 3×/sem."});
    else if(x.a.core)sugg.push({a:x.a,txt:`« ${x.a.label} » (socle) tenu ${x.dn}/${x.du} : le passer en bonus pour protéger ta série ?`,kind:"bonus",btn:"Passer en bonus"});
    else if(x.a.steps)sugg.push({a:x.a,txt:`« ${x.a.label} » tenu ${x.dn}/${x.du} : revenir au palier précédent ?`,kind:"ease",btn:"Alléger"})});
  const mv=(S.moves||[]).filter(m=>days.includes(m.d)),by={};mv.forEach(m=>{(by[m.aid]=by[m.aid]||[]).push(m)});
  Object.entries(by).forEach(([aid,L])=>{const a=S.actions.find(x=>x.id===aid);if(!a)return;
    const ex=L.filter(m=>m.kind==="today"),po=L.filter(m=>m.kind==="postpone");
    if(ex.length>=2){const cnt={};ex.forEach(m=>{const hr=m.to.slice(0,2);cnt[hr]=(cnt[hr]||[]).concat(m.to)});const best=Object.values(cnt).sort((x,y)=>y.length-x.length)[0];
      if(best.length>=2){const t=best[best.length-1];sugg.unshift({a,txt:`« ${a.label} » décalé ${ex.length} fois cette semaine, souvent vers ${t} : l'inscrire à ${t} dans ta routine ?`,kind:"rt-"+t.replace(":",""),btn:"Passer à "+t+" en routine"})}}
    if(po.length>=2&&a.freq==="d")sugg.push({a,txt:`« ${a.label} » reporté ${po.length} fois : passer à 3 fois par semaine pour qu'elle tienne ?`,kind:"f135",btn:"Passer à 3×/sem."});});
  const nextWeek=(S.events||[]).map(ev=>({ev,o:nextOcc(ev)})).filter(x=>x.o&&diff(endDay,x.o)>0&&diff(endDay,x.o)<=10);
  const meas=S.goals.filter(g=>g.metric&&g.metric.n&&(S.measures[g.id]||[]).length).map(g=>{const m=S.measures[g.id],last=m[m.length-1];
    const prev=[...m].reverse().find(x=>diff(x.d,last.d)>=6)||m[0];return{g,last,dl:last.v-prev.v,has:prev!==last}});
  return{days,held,best,worst,sugg:sugg.slice(0,4),meas,mv,nextWeek};
}
function vReview(endDay){
  const R=weekReview(endDay),pct=R.days.length?Math.round(R.held/R.days.length*100):0;
  const verdict=pct>=85?"Semaine de champion. Tu peux monter d'un cran : ajoute une promesse bonus ou passe un bonus en socle.":pct>=60?"Bonne semaine. Garde le cap et vise le socle complet chaque jour.":"Semaine difficile. On allège pour reprendre le rythme : un socle tenu vaut mieux qu'un programme parfait abandonné.";
  return`<div class="mhead"><div><div class="day">Bilan · ${fmt(R.days[0]||endDay)} → ${fmt(endDay)}</div><h2 class="disp" style="font-size:24px">${R.held}/${R.days.length} jours tenus</h2></div><button class="btn" data-do="closemodal">✕</button></div>
  <div class="bar" style="margin:4px 0 12px"><i style="width:${pct}%"></i></div><div class="mut" style="margin-bottom:14px">${verdict}</div>
  ${R.best.length?`<div class="card"><b>💪 Tes points forts</b>${R.best.map(x=>`<div class="rv"><span>${esc(x.a.label)}</span><span class="xp">${x.dn}/${x.du}</span></div>`).join("")}</div>`:""}
  ${R.worst.length?`<div class="card"><b>⚠️ À travailler</b>${R.worst.map(x=>`<div class="rv"><span>${esc(x.a.label)}</span><span class="mut">${x.dn}/${x.du}</span></div>`).join("")}</div>`:""}
  ${(S.wealth.items||[]).length?`<div class="mut sm" style="margin:0 0 10px">💰 Patrimoine net : ${amt(wealthNow().net)}${wealthDelta(1)!==null?` (${wealthDelta(1)>=0?"+":"−"}${amt(Math.abs(wealthDelta(1)))} sur 1 mois)`:""}</div>`:""}
  ${R.meas.length?`<div class="card"><b>📏 Mesures</b>${R.meas.map(m=>`<div class="rv"><span>${esc(m.g.emoji)} ${esc(m.g.metric.n)} : ${fnum(m.last.v)} ${esc(m.g.metric.u||"")}</span><span class="mut">${m.has?(m.dl>0?"+":"")+fnum(m.dl)+" en 7 j":"1re mesure"}</span></div>`).join("")}</div>`:""}
  ${R.mv.length?`<div class="mut sm" style="margin:0 0 10px">🔀 ${R.mv.filter(m=>m.kind==="today").length} décalage(s) exceptionnel(s), ${R.mv.filter(m=>m.kind==="postpone").length} report(s), ${R.mv.filter(m=>m.kind!=="today"&&m.kind!=="postpone").length} changement(s) de routine cette semaine.</div>`:""}

function durOf(a,k){
  if(/Sommeil|Debout|Au lit/i.test(a.label)||/tours?\b|pompes|squats/i.test(detailOf(a,k)))return 0;
  const t=(detailOf(a,k)+" "+a.label).replace(/(avant|après|à|vers|dès)\s+\d+\s*h(\s*\d{2})?/gi,"");
  let m=/(\d+)\s*h(?:\s*(\d{1,2}))?(?![a-z])/i.exec(t);if(m){const s=(+m[1]*60+(+m[2]||0))*60;return s<=10800?s:0}
  m=/(\d+)\s*min(?:\s*(\d{1,2}))?/i.exec(t);if(m)return +m[1]*60+(+m[2]||0);
  m=/(\d+)\s*s\b/i.exec(t);if(m)return +m[1];
  return 0;
}
let tick=null;
const mmss=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+":"+z(m):m)+":"+z(x)};
function timerLeft(){const T=S.timer;return T?(T.paused?T.left:(T.end-Date.now())/1000):0}
function startTimer(aid){

  S.timer={aid,day:today(),dur:d,end:Date.now()+d*1000,paused:false,left:d};persist();timerNotif();showTimer();
}

  if(!S.timer.paused)LN.schedule({notifications:[{id:9100,title:"⏱ Terminé : "+(a?a.label:""),body:"Promesse cochée. Bien joué.",schedule:{at:new Date(S.timer.end),allowWhileIdle:true},channelId:"rappels",smallIcon:"ic_stat_ascension",iconColor:"#C9A227"}]}).catch(()=>{})}
function showTimer(){
  const T=S.timer;if(!T){closeModal();return}const a=S.actions.find(x=>x.id===T.aid);
  const C=2*Math.PI*96;
  openModal(`<div class="tm"><div class="day">Minuteur</div><div class="disp" style="font-size:20px;margin:6px 0 16px">${esc(a?a.label:"")}</div>
  <div class="tring"><svg width="220" height="220"><circle cx="110" cy="110" r="96" stroke="#221f18" stroke-width="10" fill="none"/><circle id="tarc" cx="110" cy="110" r="96" stroke="url(#goldg)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0" transform="rotate(-90 110 110)"/></svg><b id="tval">${mmss(timerLeft())}</b></div>

const WD=["dim.","lun.","mar.","mer.","jeu.","ven.","sam."],WDL=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
function weekdayStats(){
  const st=[0,1,2,3,4,5,6].map(()=>({n:0,ok:0}));
  for(let d=S.startDate;d<today()&&diff(S.startDate,d)<S.length;d=addDays(d,1)){if(!due(d).length)continue;const w=parse(d).getDay();st[w].n++;if(valid(d))st[w].ok++}
  const rated=st.map((x,i)=>({i,n:x.n,ok:x.ok,r:x.n?x.ok/x.n:null})).filter(x=>x.n>0);
  const weak=rated.filter(x=>x.n>=2).sort((a,b)=>a.r-b.r)[0],strong=rated.filter(x=>x.n>=2).sort((a,b)=>b.r-a.r)[0];
  // promesse la plus fragile selon le jour
  let gap=null;S.actions.forEach(a=>{const per=[0,1,2,3,4,5,6].map(()=>({n:0,ok:0}));
    for(let d=S.startDate;d<today()&&diff(S.startDate,d)<S.length;d=addDays(d,1)){if(!dueOn(a,d))continue;const w=parse(d).getDay();per[w].n++;if((S.log[d]||{})[a.id])per[w].ok++}
    const tot=per.reduce((s,x)=>s+x.n,0),ok=per.reduce((s,x)=>s+x.ok,0);if(tot<6)return;const avg=ok/tot;
    per.forEach((x,w)=>{if(x.n>=2){const g=avg-x.ok/x.n;if(g>.3&&(!gap||g>gap.g))gap={a,w,g,r:x.ok/x.n,avg}}})});
  return{st,weak,strong,gap};
}
function vWeekday(){
  const W=weekdayStats(),order=[1,2,3,4,5,6,0];

  return`<div class="wdb">${order.map(i=>{const x=W.st[i],r=x.n?x.ok/x.n:0;return`<div class="wdc"><div class="wdbar"><i style="height:${Math.round(r*100)}%;${W.weak&&W.weak.i===i&&W.st.filter(y=>y.n).length>2?"background:#7a6322":""}"></i></div><span>${WD[i]}</span><em>${x.n?x.ok+"/"+x.n:"–"}</em></div>`}).join("")}</div>

}

  const y=+k.slice(0,4),md=ev.date.slice(5);return[y,y+1].map(Y=>Y+"-"+md);
}
function evTasks(k){
  const out=[];(S.events||[]).forEach(ev=>{const T=EVT[ev.type]||EVT.rdv;occOf(ev,k).forEach(o=>{(ev.prep||T.def).forEach(b=>{if(addDays(o,-b)===k)out.push({key:"ev:"+ev.id+":"+o+":"+b,label:(T.prep[b]||"{n}").replace("{n}",ev.name),e:T.e,time:ev.time||"09:00",ev})})})});
  return out;
}
function nextOcc(ev){const k=today();return occOf(ev,k).filter(o=>o>=k).sort()[0]||null}
function upcoming(days){return(S.events||[]).map(ev=>({ev,o:nextOcc(ev)})).filter(x=>x.o&&diff(today(),x.o)<=days).sort((a,b)=>a.o<b.o?-1:1)}
function vEvents(){
  const L=(S.events||[]).map(ev=>({ev,o:nextOcc(ev)})).sort((a,b)=>(a.o||"9")<(b.o||"9")?-1:1);
  let h=L.map(({ev,o})=>{const T=EVT[ev.type]||EVT.rdv,dd=o?diff(today(),o):null;
    return`<div class="evr"><div><b>${T.e} ${esc(ev.name)}</b><div class="mut sm">${o?`${parse(o).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"long"})} · ${dd===0?"aujourd'hui":"dans "+dd+" j"}`:"Passé"} · rappels ${(ev.prep||T.def).map(b=>b?"J-"+b:"Jour J").join(", ")}</div></div><button class="btn d" data-confirm="evdel:${ev.id}">✕</button></div>`}).join("");
  if(!h)h=`<div class="mut sm">Aucune date. Ajoute anniversaires, fêtes (fête des mères, Saint-Valentin…) et rendez-vous importants.</div>`;
  return h+`<div class="card evf" style="margin-top:12px"><b>+ Ajouter une date</b>

function localParse(text){
  const R=(s)=>new RegExp("(?<![\\p{L}\\d])(?:"+s+")(?![\\p{L}\\d])","iu");
  let t=" "+String(text).replace(/[’']/g," ")+" ",date="",time="",k=today(),loc="";
  const cut=re=>{const m=re.exec(t);if(m)t=t.slice(0,m.index)+" "+t.slice(m.index+m[0].length);return m};
  t=t.replace(new RegExp("(?<![\\p{L}])("+Object.keys(NUMW).sort((a,b)=>b.length-a.length).join("|")+")\\s+(heures?|h)(?![\\p{L}])","giu"),(m,a)=>NUMW[a.toLowerCase()]+" h");
  let m;
  if(cut(R("après[- ]demain")))date=addDays(k,2);
  else if(cut(R("demain")))date=addDays(k,1);
  else if(R("aujourd hui|ce soir|cet après-midi|ce matin").test(t)){date=k;cut(R("aujourd hui"))}
  else{if(m=cut(R("(?:ce |cette )?(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)(?: prochain)?"))){const w=WDAY.indexOf(m[1].toLowerCase());date=addDays(k,(w-parse(k).getDay()+7)%7||7)}
    if(m=cut(R("le (\\d{1,2})(?: (janvier|février|mars|avril|mai|juin|juillet|août|septembre|octobre|novembre|décembre))?"))){const MO=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"],now=parse(k);const mo=m[2]?MO.indexOf(m[2].toLowerCase()):now.getMonth(),y=now.getFullYear();let d=new Date(y,mo,+m[1]);if(key(d)<k)d=m[2]?new Date(y+1,mo,+m[1]):new Date(y,mo+1,+m[1]);date=key(d)}}
  if(m=cut(R("(?:(?:à|a|vers|pour|dès) )?(\\d{1,2}) ?(?:h|heures?|:) ?(\\d{2}|et demie|et quart|moins le quart)?"))){let h=+m[1];const x=(m[2]||"").toLowerCase(),mi=x==="et demie"?30:x==="et quart"?15:x==="moins le quart"?-15:+(x||0);if(h<8&&/après-midi|soir/i.test(t))h+=12;time=fromMin(h*60+mi)}
  else if(m=cut(R("(?:à |a |vers )?midi(?: et demi)?"))){time=/demi/i.test(m[0])?"12:30":"12:00"}
  if(time&&!date){const n=new Date();date=time>z(n.getHours())+":"+z(n.getMinutes())?k:addDays(k,1)}
  cut(R("ce soir|cet après-midi|ce matin"));
  const rdv=R("rdv|rendez-vous|rendez vous|réunion|déjeuner|dîner|diner|petit-déjeuner|visite|consultation|médecin|dentiste|notaire|avec").test(t);
  if(rdv&&(m=/\s((?:chez|au|à la|à l |à|a)\s+[^,]+?)\s*$/iu.exec(t.replace(/\s+/g," ")))&&!/avec/i.test(m[1])){loc=m[1].replace(/^(à|a)\s+/i,"").trim();t=t.replace(m[1]," ")}
  t=t.replace(R("mets[- ]moi|ajoute[- ]moi|ajoute|mets|programme|planifie|note|rappelle[- ]moi de|rappelle[- ]moi|il faut que je|je dois|tâche|tache|un|une"),"").replace(R("mets[- ]moi|ajoute[- ]moi|un|une"),"");
  let title=t.replace(/\s+/g," ").trim().replace(/^(à|a|le|la|pour|de|d)\s+/i,"").replace(/\s+(à|a|le|la|pour|de|et)$/i,"").trim();
  title=title.charAt(0).toUpperCase()+title.slice(1);loc=loc.charAt(0).toUpperCase()+loc.slice(1);
  return title?[{kind:rdv?"rdv":"task",title,date,time,dur:rdv?60:30,loc}]:[];
}

    const d=new Date(e.begin),date=key(d),time=z(d.getHours())+":"+z(d.getMinutes()),dur=Math.max(5,Math.round((e.end-e.begin)/60000)),title=stripMark(e.title||"");

  try{if(mod("body")){const r=await HealthP.readSamples({dataType:"weight",startDate:new Date(now.getTime()-7*864e5).toISOString(),endDate:now.toISOString(),limit:20});
    const W=(r.samples||[]).sort((a,b)=>a.endDate<b.endDate?-1:1).pop();if(W){const d=key(new Date(W.endDate)),L=(S.body&&S.body.log)||[];if(!L.length||L[L.length-1].d<d||(L[L.length-1].d===d&&Math.abs(L[L.length-1].v-W.value)>.05)){if(d===k)addWeight(Math.round(W.value*10)/10)}}}}catch(e){}
  const L=S.log[k]||{},auto=[];
  due(k).forEach(a=>{if(L[a.id])return;const st=stepTarget(a),sl=sleepTarget(a);if((st&&health.steps>=st)||(sl&&health.sleep>=sl))auto.push(a)});
  if(auto.length){markDone(auto.map(a=>a.id),k);toast("✓ Validé par tes données santé : "+auto.map(a=>a.label).join(", "))}

}

/* ---------- logique ---------- */
const entries=()=>Object.values(S.log).flatMap(d=>Object.values(d));
const totalXP=()=>entries().reduce((a,e)=>a+e.x,0);
const goalXP=g=>entries().filter(e=>e.g===g).reduce((a,e)=>a+e.x,0);
function gradeOf(xp){const GRADES=GRADES_OF();let i=0;GRADES.forEach((g,j)=>{if(xp>=g[1])i=j});const nx=GRADES[i+1];return{i,name:GRADES[i][0],cur:GRADES[i][1],next:nx?nx[1]:null,nextName:nx?nx[0]:null}}
const lvl=xp=>Math.floor(Math.sqrt(xp/40))+1;
const phaseOf=k=>{const i=diff(S.startDate,k);return i<0?0:Math.min(2,Math.floor(i*3/S.length))};
const phaseStart=p=>addDays(S.startDate,Math.ceil(p*S.length/3));
const detailOf=(a,k)=>a.steps?a.steps[phaseOf(k)]:(a.detail||"");
const dueOn=(a,k)=>!a.freq||a.freq==="d"||a.freq.includes(String(parse(k).getDay()));
const due=k=>{const P=planOf(k),m=offMode(k);return S.actions.filter(a=>{if(P[a.id]&&(P[a.id].skip||P[a.id].add))return!P[a.id].skip;if(!dueOn(a,k)||m==="off")return false;return m==="light"?offKeep(a):true})};
function ratio(k){const d=due(k),L=S.log[k]||{};return d.length?d.filter(a=>L[a.id]).length/d.length:0}
function valid(k){
  const d=due(k),L=S.log[k]||{};
  if(S.jokers[k])return Object.keys(L).length>0;
  {const P=planOf(k);if(Object.keys(P).some(id=>P[id].skip&&(S.actions.find(a=>a.id===id)||{}).core))return false}
  if(!d.length)return false;
  const c=d.filter(a=>a.core);
  return c.length?c.every(a=>L[a.id]):d.every(a=>L[a.id]);
}
function streak(){let d=today(),n=0;if(!valid(d))d=addDays(d,-1);while(d>=S.startDate&&(valid(d)||!due(d).length)){if(due(d).length||S.jokers[d])n++;d=addDays(d,-1)}return n}
const dayNum=()=>Math.max(1,Math.min(S.length,diff(S.startDate,today())+1));
const jokersUsed=k=>Object.keys(S.jokers).filter(d=>d.slice(0,7)===k.slice(0,7)).length;
function measuresDue(){return S.goals.filter(g=>g.metric&&g.metric.n&&(()=>{const m=S.measures[g.id]||[];return!m.length||diff(m[m.length-1].d,today())>=7})())}

function toggle(aid){
  const a=S.actions.find(x=>x.id===aid);if(!a)return;
  const k=today(),before=gradeOf(totalXP()).i,wasValid=valid(k);
  const L=S.log[k]||(S.log[k]={});
  if(L[aid])delete L[aid];else L[aid]={x:a.xp,g:a.goalId};
  if(!Object.keys(L).length)delete S.log[k];
  persist();
  const g=gradeOf(totalXP());
  if(g.i>before)toast(univ().up+" : "+g.name);
  else if(!wasValid&&valid(k))toast(S.jokers[k]?"Jour minimum tenu. La série continue. 🛡️":"Socle tenu. Journée validée. 🔒");
  checkTrophies();render();
}

function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2800)}
function run(cmd){
  if(cmd.startsWith("agck:")){const it=agCur[cmd.slice(5)];closeModal();if(it)agCheck(it);return}
  const[c,id,x3]=cmd.split(":");const k=today();
  if(c==="agadd"){agOpen(null);return}
  if(c==="goalnew"){goalStart();return}
  if(c==="gpvoice"){closeModal();goalVoice();return}
  if(c==="gptext"){const v=(document.getElementById("gpT").value||"").trim();if(!v){toast("Écris ton objectif");return}goalBuild(v);return}
  if(c==="gpok"){goalCommit();return}
  if(c==="voice"){closeModal();voiceStart();return}
  if(c==="vcall"){voiceApply();return}
  if(c==="vcedit"){const o=vcOps[+id];if(o){vcOps.splice(+id,1);const it={kind:o.kind==="rdv"?"rdv":"task",t:o.title,date:o.date||(o.kind==="rdv"?today():""),time:o.time||"",dur:+o.dur||60,loc:o.loc||""};openModal(agSheet({...it,g:it.kind==="rdv"&&!!S.cal.gw,voice:vcText,via:vcVia}))}return}
  if(c==="aikey"){const v=(document.getElementById("aiK").value||"").trim();if(!/^sk-ant-/.test(v)){toast("Colle une clé qui commence par sk-ant-");return}aiSaveKey(v).then(()=>{aiState="";render();toast("Clé enregistrée sur ce téléphone")});return}
  if(c==="aidel"){aiSaveKey("").then(()=>{render();toast("Clé retirée")});return}
  if(c==="aitest"){toast("Test en cours…");aiParse("rendez-vous demain à 15 h avec Paul chez le notaire").then(it=>{aiState="";render();toast(it.length?"✓ Clé valide : "+it[0].title+" · "+(it[0].date?fmt(it[0].date):"")+" "+(it[0].time||""):"Réponse vide")},e=>{aiState=String(e.message||e);render();toast("Échec : "+aiState)});return}
  if(c==="agmode"){agMode=id;render();return}
  if(c==="agday"){agDay=+id===0?null:addDays(agDay||k,+id);if(agDay===k)agDay=null;render();return}
  if(c==="agkind"){agRead();agForm.kind=id;if(id==="rdv"&&(!agForm.dur||agForm.dur<60))agForm.dur=60;openModal(agSheet(agForm));return}
  if(c==="agsave"){agSave();return}

  if(c==="agmv"){closeModal();moveSheet(id,agDay||k);return}
  if(c==="gkind"){S.cal.kind[id]=x3==="task"?"task":"rdv";closeModal();persist();render();toast(x3==="task"?"Traité comme une tâche à cocher":"Traité comme un rendez-vous");return}
  if(c==="gtaskt"){S.cal.asTask=S.cal.asTask===false;persist();render();toast(S.cal.asTask?"Événements Google = tâches à cocher":"Événements Google = rendez-vous");return}

  if(c==="ritualok"){const i=document.getElementById("prioIn");S.prio=S.prio||{};if(i&&i.value.trim())S.prio[k]=i.value.trim();S.ritual=S.ritual||{};S.ritual[k]=true;closeModal();persist();render();toast("C'est parti. Une journée à la fois.");return}
  if(c==="ritualskip"){S.ritual=S.ritual||{};S.ritual[k]=true;closeModal();persist();return}

  if(c==="tournext"){tourI++;openModal(vTour());return}

  if(c==="nowskip"){nowSkip.push(id);openModal(vNow());return}
  if(c==="nowdone"){if(id.startsWith("td-")){const t=(S.todos||[]).find(x=>x.id===id.slice(3));if(t){t.done=true;t.doneAt=k;(S.log[k]=S.log[k]||{})["td:"+t.id]={x:5,g:null};persist()}}else markDone([id],k);toast("✓ Bien joué");openModal(vNow());render();openModal(vNow());return}

  if(c==="obintro"){if(ob){ob.intro=true;render();scrollTo(0,0)}return}
  if(c==="univ"){S.profile=S.profile||{};S.profile.univ=id;persist();render();toast("Univers : "+univ().n+" · tu es "+gradeOf(totalXP()).name);return}
  if(c==="bweigh"){const v=num((document.getElementById("bW")||{}).value);if(v===null||v<20||v>400){toast("Saisis ton poids en kg");return}addWeight(v);persist();checkTrophies();render();toast("Pesée enregistrée");return}
  if(c==="tdadd"){const t=(document.getElementById("tdT").value||"").trim();if(!t){toast("Écris ta tâche");return}
    const d=document.getElementById("tdD").value||"",hh=document.getElementById("tdH").value||"";S.todos=S.todos||[];const nx={id:uid(),t,date:d,time:hh,done:false};S.todos.push(nx);todoSync(nx);todoDate=d;persist();render();
    setTimeout(()=>{const i=document.getElementById("tdT");i&&i.focus()},50);return}
  if(c==="unlock"){unlock(id);return}
  if(c==="lock"){setLock(id);return}
  if(c==="discreet"){S.discreet=!S.discreet;persist();applyDiscreet();render();return}
  if(c==="vtab"){visTab=id;tab="vision";render();scrollTo(0,0);return}
  if(c==="wcat"){wCat=id;render();return}
  if(c==="wadd"){const n=(document.getElementById("wN").value||"").trim(),v=num(document.getElementById("wV").value);if(!n||v===null){toast("Nom et montant");return}
    S.wealth.items.push({id:uid(),cat:wCat,name:n,value:Math.abs(v)});snapWealth();persist();render();toast("Ajouté");return}
  if(c==="wdel"){S.wealth.items=S.wealth.items.filter(i=>i.id!==id);snapWealth();persist();render();return}
  if(c==="wsnap"){snapWealth();persist();render();toast("Relevé enregistré");return}
  if(c==="calon"){connectCalendar();return}
  if(c==="caloff"){S.cal.on=false;calCache={};persist();render();return}
  if(c==="calrefresh"){loadCalendar(true).then(()=>toast("Agenda actualisé"));return}
  if(c==="mvafter"){applyMove(id,mvDay||k,"today",x3.slice(0,2)+":"+x3.slice(2));closeModal();persist();render();return}
  if(c==="dok"){const n=(document.getElementById("drN").value||"").trim();if(!n){toast("Indique ton rêve");return}
    const o={name:n,price:num(document.getElementById("drP").value)||0,date:document.getElementById("drD").value||"",saved:num(document.getElementById("drS").value)||0,why:(document.getElementById("drW").value||"").trim(),art:document.getElementById("drA").value};
    S.dreams=S.dreams||[];if(dreamEdit){Object.assign(S.dreams.find(x=>x.id===dreamEdit)||{},o)}else{const d={id:uid(),...o};if(o.art==="villa"&&/aventador|lambo|ferrari|porsche|mclaren|bugatti|voiture|v[ée]hicule|\bauto\b|car\b/i.test(o.name))d.art="car";S.dreams.push(d);dreamEdit=d.id;toast("Rêve ajouté. Ajoute ta photo !")}persist();render();return}
  if(c==="dedit"){dreamEdit=id;render();setTimeout(()=>{const x=document.getElementById("drN");x&&x.scrollIntoView({behavior:"smooth",block:"center"})},50);return}
  if(c==="dcancel"){dreamEdit=null;render();return}
  if(c==="ddel"){S.dreams=(S.dreams||[]).filter(d=>d.id!==id);delete S.photos["d:"+id];dreamEdit=null;persist();render();return}
  if(c==="dsave"){const i=document.querySelector(`[data-dsave="${id}"]`),v=i&&num(i.value),d=(S.dreams||[]).find(x=>x.id===id);if(v===null||!d){toast("Saisis un montant");return}d.saved=(+d.saved||0)+v;(d.hist=d.hist||[]).push({d:k,v});persist();render();toast(`+${eur(v)} pour ${d.name}`);return}
  if(c==="mvadd"){const i=document.getElementById("mvT");if(i)i.value=addMin(i.value,+id);return}
  if(c==="mvok"){const t=document.getElementById("mvT").value,sc=(document.querySelector('input[name="mvS"]:checked')||{}).value||"today";if(t){applyMove(id,mvDay||k,sc,t)}closeModal();persist();render();return}
  if(c==="mvpost"){postpone(id,k);closeModal();persist();render();return}
  if(c==="tday"){typeDay=+id;render();return}
  if(c==="evtype"){evType=id;render();return}
  if(c==="evadd"){const n=(document.getElementById("evN").value||"").trim(),d=document.getElementById("evD").value;if(!n||!d){toast("Indique un nom et une date");return}
    const prep=[...document.querySelectorAll(".chk input:checked")].map(x=>+x.value);S.events=S.events||[];S.events.push({id:uid(),type:evType,name:n,date:d,prep:prep.length?prep:EVT[evType].def});toast("Date ajoutée");persist();render();return}
  if(c==="evdel"){S.events=(S.events||[]).filter(e=>e.id!==id);persist();render();return}
  if(c==="review"){rvEnd=id||k;openModal(vReview(rvEnd));return}
  if(c==="closemodal"){closeModal();if(tab==="agenda")render();return}
  if(c==="reviewseen"){S.reviews=S.reviews||{};S.reviews[id]=true;closeModal()}
  if(c==="adj"){const a=S.actions.find(x=>x.id===id);if(a){if(x3==="f135")a.freq="135";if(x3&&x3.startsWith("rt-")){a.time=x3.slice(3,5)+":"+x3.slice(5,7);a.wt={}}if(x3==="bonus")a.core=false;if(x3==="ease"&&a.steps){const p=phaseOf(k);if(p>0)a.steps[p]=a.steps[p-1]}toast("Ajusté : "+a.label)}
    persist();const m=document.getElementById("modal");if(m.classList.contains("on"))openModal(vReview(rvEnd||k));render();return}
  if(c==="backup"){backupNow(false);return}
  if(c==="restore"){if(pendingRestore){S=migrate(pendingRestore);pendingRestore=null;persist();checkTrophies();render();toast("Données restaurées")}return}
  if(c==="norestore"){pendingRestore=null}
  if(c==="tpause"){const T=S.timer;if(T){if(T.paused){T.end=Date.now()+T.left*1000;T.paused=false}else{T.left=timerLeft();T.paused=true}persist();timerNotif();showTimer()}return}
  if(c==="tplus"){const T=S.timer;if(T){if(T.paused)T.left+=60;else T.end+=60000;T.dur+=60;persist();timerNotif();timerTick()}return}
  if(c==="tstop"){S.timer=null;clearInterval(tick);LN&&LN.cancel({notifications:[{id:9100}]}).catch(()=>{});closeModal();persist();return}
  if(c==="addG"){const g={id:uid(),name:"Nouveau domaine",emoji:"⭐",target:"",metric:{n:"",u:""}};S.goals.push(g);S.actions.push({id:uid(),goalId:g.id,label:"Première promesse",detail:"",steps:null,xp:10,freq:"d",slot:"",time:"",core:false})}
  if(c==="addA")S.actions.push({id:uid(),goalId:id,label:"Nouvelle promesse",detail:"",steps:null,xp:10,freq:"d",slot:"",time:"",core:false});
  if(c==="delA")S.actions=S.actions.filter(a=>a.id!==id);
  if(c==="delG"){S.goals=S.goals.filter(g=>g.id!==id);S.actions=S.actions.filter(a=>a.goalId!==id)}
  if(c==="core"){const a=S.actions.find(x=>x.id===id);if(a){if(!a.core&&S.actions.filter(x=>x.core).length>=MAX_CORE)toast("5 socles maximum conseillés. Ajouté quand même.");a.core=!a.core}}
  if(c==="joker"){if(jokersUsed(k)<JOKERS_PER_MONTH){S.jokers[k]=true;toast("Jour minimum : une promesse suffit. Choisis la plus importante.")}}
  if(c==="unjoker")delete S.jokers[k];
  if(c==="meas"){const i=document.querySelector(`[data-mv="${id}"]`),v=i&&num(i.value);if(v===null){toast("Saisis un nombre");return}
    const m=S.measures[id]||(S.measures[id]=[]);const last=m[m.length-1];if(last&&last.d===k)last.v=v;else m.push({d:k,v});
    {const g=S.goals.find(x=>x.id===id);if(g&&g.key==="body"&&/poids/i.test(g.metric.n)&&mod("body")){S.body=S.body||{log:[]};const L=S.body.log||(S.body.log=[]),l=L[L.length-1];if(l&&l.d===k)l.v=v;else L.push({d:k,v})}}
    toast("Mesure enregistrée");checkTrophies()}
  if(c==="update"){doUpdate();return}
  if(c==="checkupd"){checkUpdate(true).then(()=>toast(upd?"Nouvelle version disponible":"Tu as la dernière version"));return}
  if(c==="unphoto"){delete S.photos[id];toast("Photo retirée")}
  if(c==="notifon")S.notif.on=!S.notif.on;
  if(c==="exact"){LN&&LN.changeExactNotificationSetting().then(r=>{exactPerm=r.exact_alarm;scheduleSoon()}).catch(()=>{});return}
  if(c==="testnotif"){if(LN)LN.schedule({notifications:[{id:9999,title:"Ascension",body:"Les rappels fonctionnent. Tiens tes promesses. ⚔️",schedule:{at:new Date(Date.now()+5000),allowWhileIdle:true},channelId:"rappels",smallIcon:"ic_stat_ascension",iconColor:"#C9A227"}]}).then(()=>toast("Notification dans 5 secondes"),()=>toast("Notifications non autorisées"));return}
  if(c==="import"){const t=document.getElementById("imp");try{const n=JSON.parse(t.value);if(!n||!n.actions)throw 0;const ph=S.photos;S=migrate(n);if(!Object.keys(S.photos).length)S.photos=ph;persist();render();toast("Données importées")}catch(e){toast("Texte invalide : copie-le depuis la version web")}return}
  if(c==="restart"){S.startDate=k;S.lastPhase=0;toast("Jour 1. C'est reparti.")}
  if(c==="redo"){ob={i:0,a:{...(S.profile&&S.profile.answers||{})}};render();scrollTo(0,0);return}
  if(c==="copy"){const t=JSON.stringify({...S,photos:{}});navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>toast("Données copiées"),()=>toast("Copie refusée par le navigateur"));return}
  persist();render();
}
document.addEventListener("click",e=>{
  const on=e.target.closest("[data-ob]");
  if(on&&ob){const st=STEPS[ob.i],v=on.dataset.ob;
    if(st.type==="multi"){const cur=ob.a[st.id]||[];ob.a[st.id]=cur.includes(v)?cur.filter(x=>x!==v):cur.length<st.max?[...cur,v]:cur}
    else ob.a[st.id]=v;
    render();return}
  const pre=e.target.closest("[data-pre]");
  if(pre&&ob){saveTargets();const[k,pk]=pre.dataset.pre.split(":");ob.a.presets={...(ob.a.presets||{}),[k]:pk};render();return}
  const onv=e.target.closest("[data-obnav]");
  if(onv&&ob){const nv=onv.dataset.obnav;if(nv==="cancel"){ob=null;render()}else if(nv==="back"){saveForm();obGo(-1)}else if(nv==="skip"){ob.a[STEPS[ob.i].id]={};obGo(1)}else obNext();return}
  const nb=e.target.closest("nav button");if(nb){tab=nb.dataset.tab;render();scrollTo(0,0);return}
  const tg=e.target.closest("[data-tabgo]");if(tg){tab=tg.dataset.tabgo;render();scrollTo(0,0);return}
  const vw=e.target.closest("[data-view]");if(vw){S.view=vw.dataset.view;persist();render();return}
  const tdl=e.target.closest("[data-tdel]");if(tdl){const x=(S.todos||[]).find(t=>t.id===tdl.dataset.tdel);if(x&&x.gid)gDelete(x.gid);S.todos=(S.todos||[]).filter(t=>t.id!==tdl.dataset.tdel);persist();render();return}
  const tdo=e.target.closest("[data-todo]");if(tdo){const t=(S.todos||[]).find(x=>x.id===tdo.dataset.todo);if(t){const k=today(),L=S.log[k]||(S.log[k]={});t.done=!t.done;t.doneAt=t.done?k:null;
    if(t.done){L["td:"+t.id]={x:5,g:null};toast("✓ Fait")}else delete L["td:"+t.id];if(!Object.keys(L).length)delete S.log[k];persist();checkTrophies();render()}return}
  const gck=e.target.closest("[data-gck]");if(gck){if(Date.now()-suppressClick>700){const it=agCur[gck.dataset.gck];if(it)agCheck(it)}return}
  const gb=e.target.closest("[data-gb]");if(gb){if(Date.now()-suppressClick>700)agOpen(agCur[gb.dataset.gb]);return}
  const mvb=e.target.closest("[data-move]");if(mvb){moveSheet(mvb.dataset.move,today());return}
  const evb=e.target.closest("[data-evt]");if(evb){const k=today(),key=evb.dataset.evt,L=S.log[k]||(S.log[k]={});if(L[key])delete L[key];else{L[key]={x:10,g:null};toast("✓ C'est fait")}if(!Object.keys(L).length)delete S.log[k];persist();render();return}
  const tm=e.target.closest("[data-timer]");if(tm){startTimer(tm.dataset.timer);return}
  const md=e.target.closest("#modal");if(md&&e.target===md){closeModal();return}
  const t=e.target.closest("[data-toggle]");if(t){toggle(t.dataset.toggle);return}
  const d=e.target.closest("[data-do]");if(d){run(d.dataset.do);return}
  const c=e.target.closest("[data-confirm]");
  if(c){if(c.classList.contains("armed")){run(c.dataset.confirm)}else{c.classList.add("armed");c.dataset.txt=c.textContent;c.textContent="Confirmer ?";setTimeout(()=>{if(c.isConnected){c.classList.remove("armed");c.textContent=c.dataset.txt}},3000)}}
});
document.addEventListener("change",e=>{
  const gpo=e.target.closest("[data-gpon]");if(gpo&&gpDraft){gpDraft.actions[+gpo.dataset.gpon].on=gpo.checked;openModal(vGoalDraft());return}
  const gpf=e.target.closest("[data-gpf]");if(gpf&&gpDraft){const a=gpDraft.actions[+gpf.dataset.gpf],kk=gpf.dataset.k;a[kk]=kk==="dur"?+gpf.value:gpf.value;openModal(vGoalDraft());return}
  const t=e.target;
  if(t.dataset.g){const g=S.goals.find(x=>x.id===t.dataset.g);if(g){g[t.dataset.f]=t.value.trim();persist()}}
  if(t.dataset.gm){const g=S.goals.find(x=>x.id===t.dataset.gm);if(g){g.metric=g.metric||{n:"",u:""};g.metric[t.dataset.f]=t.value.trim();persist()}}
  if(t.dataset.a){const a=S.actions.find(x=>x.id===t.dataset.a),f=t.dataset.f;if(a){
    if(f==="xp")a.xp=+t.value;
    else if(f==="detail"){if(a.steps)a.steps[phaseOf(today())]=t.value.trim();else a.detail=t.value.trim()}
    else a[f]=f==="label"||f==="trig"?t.value.trim():t.value;
    persist();if(f==="freq"||f==="slot")render()}}
  if(t.dataset.gart){const g=S.goals.find(x=>x.id===t.dataset.gart);if(g){g.art=t.value;if(S.photos[g.id])toast("Ta photo reste prioritaire : retire-la pour voir l'illustration");persist();render()}}
  if(t.dataset.photo&&t.files&&t.files[0]){const gid=t.dataset.photo;readPhoto(t.files[0],u=>{S.photos[gid]=u;persist();render();toast("Photo ajoutée")})}
  if(t.dataset.wt){const a=S.actions.find(x=>x.id===t.dataset.wt);if(a&&t.value){a.wt=a.wt||{};a.wt[typeDay]=t.value;S.moves=S.moves||[];S.moves.push({d:today(),aid:a.id,kind:"wd",from:"",to:t.value});persist();render()}}
  if(t.dataset.bd){S.body=S.body||{log:[]};const v=num(t.value);S.body[t.dataset.bd]=v;persist();render()}
  if(t.dataset.wv){const i=S.wealth.items.find(x=>x.id===t.dataset.wv),v=num(t.value);if(i&&v!==null){i.value=Math.abs(v);snapWealth();persist();render()}}
  if(t.dataset.dphoto&&t.files&&t.files[0]){const id=t.dataset.dphoto;readPhoto(t.files[0],u=>{S.photos["d:"+id]=u;persist();render();toast("Photo ajoutée")})}
  if(t.dataset.pt){S.partner=S.partner||{};S.partner[t.dataset.pt]=t.value.trim();persist()}
  if(t.dataset.jr){S.journal=S.journal||{};const J=S.journal[t.dataset.jd]||(S.journal[t.dataset.jd]={});J[t.dataset.jr]=t.value.trim();persist();checkTrophies()}
  if(t.dataset.restore&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const n=JSON.parse(r.result);if(!n||!Array.isArray(n.actions)||!Array.isArray(n.goals))throw 0;pendingRestore=n;render()}catch(e){toast("Fichier invalide : choisis un fichier ascension-sauvegarde")}};r.readAsText(t.files[0])}
  if(t.dataset.nt){S.notif.times[t.dataset.nt]=t.value||S.notif.times[t.dataset.nt];persist()}
  if(t.dataset.nb){S.notif[t.dataset.nb]=t.value||S.notif[t.dataset.nb];persist()}
  if(t.dataset.set){const v=t.dataset.set==="length"?Math.max(9,Math.min(365,+t.value||90)):t.value;if(v){S[t.dataset.set]=v;persist();render()}}
});
init();
</script>
